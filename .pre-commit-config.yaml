repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        files: ^src/
      - id: trailing-whitespace
        files: ^src/
      - id: check-yaml
        files: ^(\.pre-commit-config\.yaml|\.github/.*\.ya?ml)$

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^src/
        types_or: [python, pyi]
