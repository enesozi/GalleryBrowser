[project]
name = "gallery-browser"
version = "0.1.0"
description = "Minimal uv-based perception_models experiment package"
readme = "README.md"
authors = [
    { name = "enes.ozipek", email = "enes.ozipek@nestai.com" }
]
requires-python = ">=3.12"
dependencies = [
    "decord>=0.6.0",
    "ftfy>=6.3.1",
    "perception-models",
    "xformers>=0.0.35",
]

[project.scripts]
gallery-browser = "gallery_browser.cli:main"
gallery-browser-smoke = "gallery_browser.smoke:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=24.0.0",
    "pre-commit>=3.7.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.uv.sources]
perception-models = { git = "https://github.com/facebookresearch/perception_models.git" }
